<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cart.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    
    <header>
        <div class="logo">WILDOZON</div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="products.html">Товары</a>
        </nav>
        <div class="cart">
            <a href="cart.html">Корзина</a>
        </div>
    </header>

    <main>
        <div class="container">

            <div class="cart-container">
                <div class="cart-elements">
                    <div class="cart-el">
                        <div class="cart-el-top">
                            <img src="image.png" alt="картинка" class="cart-el-img">
                            <div class="cart-el-text">
                                <p class="cart-el-price">$1000</p>
                                <p class="cart-el-title">Компьютер RTX7099 Intel Core i21 38900H</p>
                            </div>
                        </div>
                        <div class="cart-el-btns">
                            <button class="cart-el-delete">Удалить</button>
                            <button class="cart-el-buy">Купить</button>
                        </div>
                    </div>
                </div>
                <div class="summary">
                    <div class="summary-header">ИТОГО:</div>
                    <div class="summary-info">
                        <p class="summary-prod">Товары:</p>
                        <p class="summary-price">$1487</p>
                    </div>
                    <button class="summary-buy">Купить всё</button>
                </div>
            </div>
                
        </div>
    </main>
</body>
</html>
